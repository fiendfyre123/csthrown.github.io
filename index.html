<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS2 战术站 · 六合一资料库</title>
<meta name="description" content="CS2战术站，提供道具图鉴、投掷点位、战术百科、战队选手、地图介绍与武器介绍。" />
<style>
:root{
    --bg:#0b0e14; --bg2:#12171f; --bg3:#0d1219; --border:#262e3a; --border2:#2a3342;
    --gold:#f0b000; --gold-dark:#d4a017; --text:#e6e9f0; --text2:#a7b1c2; --muted:#6a778b;
    --t-color:#f0a030; --t-bg:#3a2a1a; --t-border:#5a3a20; --ct-color:#4ab0f0; --ct-bg:#1a2a3a; --ct-border:#2a4a6a;
    --green:#4ade80; --yellow:#fbbf24; --red:#f87171; --radius:16px; --radius-sm:12px; --shadow:0 8px 16px rgba(0,0,0,.6);
    --shadow-hover:0 16px 28px rgba(240,176,0,.12); --transition:.25s ease; --font:'Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:var(--font);color:var(--text);line-height:1.6;padding:0 20px 60px;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg3)}::-webkit-scrollbar-thumb{background:#2a313e;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#3a4357}
.wrapper{max-width:1400px;margin:0 auto}

.navbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:16px;position:sticky;top:0;background:var(--bg);z-index:50;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;user-select:none}
.logo-icon{font-size:2rem;filter:drop-shadow(0 0 8px rgba(240,176,0,.6));animation:pulse-glow 3s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{filter:drop-shadow(0 0 8px rgba(240,176,0,.6))}50%{filter:drop-shadow(0 0 18px rgba(240,176,0,.9))}}
.logo h1{font-size:1.9rem;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#f5e6b0,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase}
.logo span{font-size:.8rem;color:var(--muted);-webkit-text-fill-color:var(--muted);letter-spacing:2px;font-weight:400;margin-left:6px}
.search-box{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:40px;padding:4px 4px 4px 18px;align-items:center;transition:var(--transition);min-width:280px}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,176,0,.15)}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:1rem;width:220px;padding:8px 0;flex:1}
.search-box input::placeholder{color:#5e6a7e;font-size:.9rem}
.search-box .clear-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:4px 6px;display:none;border-radius:50%;transition:var(--transition);line-height:1}
.search-box .clear-btn.visible{display:flex}
.search-box .clear-btn:hover{color:var(--gold);background:rgba(255,255,255,.05)}
.search-box button{background:#2a313e;border:none;border-radius:30px;padding:10px 18px;color:#cbd2e0;font-weight:600;cursor:pointer;font-size:.9rem;transition:var(--transition);white-space:nowrap}
.search-box button:hover{background:var(--gold);color:var(--bg)}
.search-mode{display:flex;gap:6px;margin-left:10px}
.mode-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;font-size:.75rem;cursor:pointer;transition:var(--transition)}
.mode-btn.active{background:#1e2a3a;border-color:var(--gold);color:var(--gold)}

.main-switch{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:28px;width:fit-content;flex-wrap:wrap;gap:4px}
.switch-btn{background:transparent;border:none;color:var(--muted);padding:10px 20px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:var(--transition)}
.switch-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.switch-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg);box-shadow:0 4px 12px rgba(240,176,0,.3)}
.switch-emoji{font-size:1.1rem}

.module{display:none}.module.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.filter-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.filter-btn{background:var(--bg2);border:1px solid var(--border);color:#b1b9c9;padding:9px 20px;border-radius:30px;font-weight:600;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:var(--transition);user-select:none}
.filter-btn .emoji{font-size:1.1rem}
.filter-btn:hover{border-color:var(--gold);color:#fff;background:#222937;transform:translateY(-1px)}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700;box-shadow:0 4px 12px rgba(240,176,0,.25)}
.filter-btn .map-count{display:inline-block;background:rgba(0,0,0,.2);color:inherit;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.15);line-height:1.4;min-width:24px;text-align:center}
.filter-btn.active .map-count{background:rgba(0,0,0,.3);border-color:rgba(0,0,0,.2)}
.map-count-zero{opacity:.5}

.sub-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;padding:8px 0}
.sub-btn{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:20px;font-size:.82rem;cursor:pointer;font-weight:600;transition:var(--transition);user-select:none}
.sub-btn:hover{border-color:#3a4357;color:#cbd2e0}
.sub-btn.active{background:#1e2a3a;border-color:var(--gold);color:var(--gold);font-weight:700}
.sub-btn .fav-star{color:var(--gold)}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:8px}
.item-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:var(--transition);position:relative;opacity:0;transform:translateY(20px)}
.item-card.visible{opacity:1;transform:translateY(0)}
.item-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-hover)}
.item-card .card-hint{position:absolute;top:12px;right:12px;background:#1e2632;border:1px solid #2f3a4a;color:var(--muted);font-size:.68rem;padding:2px 8px;border-radius:12px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.item-card:hover .card-hint{opacity:1}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;border-bottom:1px solid #232b37;gap:10px;flex-wrap:wrap}
.item-name{font-size:1.15rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.item-emoji{font-size:1.5rem;filter:drop-shadow(0 0 5px rgba(240,176,0,.5));flex-shrink:0}
.side-badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.side-badge.T{background:var(--t-bg);color:var(--t-color);border:1px solid var(--t-border)}
.side-badge.CT{background:var(--ct-bg);color:var(--ct-color);border:1px solid var(--ct-border)}
.side-badge.both{background:#1e2632;color:#8a94a6;border:1px solid #2f3a4a}
.item-price{background:#1e2632;padding:6px 12px;border-radius:30px;font-size:.85rem;font-weight:700;color:var(--gold);border:1px solid #3a4357;white-space:nowrap}
.card-body{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.area-tag{display:inline-block;background:#1a2230;color:#9bb5d4;padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:700;border:1px solid #2a3a50;align-self:flex-start}
.description{color:var(--text2);font-size:.9rem;line-height:1.7;border-left:3px solid var(--gold);padding:10px 14px;background:#0f131b;border-radius:8px;flex:1}
.stats{display:flex;justify-content:space-around;background:var(--bg3);border-radius:12px;padding:12px 10px;border:1px solid #1e2632;gap:6px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:60px}
.stat-label{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.stat-value{font-weight:700;color:#dfe5f0;font-size:.95rem}
.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.difficulty{display:flex;align-items:center;gap:4px;font-weight:700}
.diff-简单{color:var(--green)}.diff-中等{color:var(--yellow)}.diff-困难{color:var(--red)}
.throw-type{background:#1e2632;padding:3px 10px;border-radius:12px;font-size:.72rem;color:var(--muted);font-weight:600;border:1px solid #2f3a4a}

.fav-btn{background:transparent;border:none;cursor:pointer;font-size:1.2rem;padding:4px;border-radius:50%;transition:var(--transition);line-height:1;flex-shrink:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;user-select:none}
.fav-btn:hover{background:rgba(255,255,255,.08);transform:scale(1.1)}
.fav-btn.faved{color:var(--gold);filter:drop-shadow(0 0 4px rgba(240,176,0,.5))}
.fav-btn:not(.faved){color:#4a5568}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.fav-btn.pop{animation:pop .3s ease}

.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;background:var(--bg2);border-radius:24px;border:1px dashed #2e3a4a;color:var(--muted);font-size:1.2rem}
.empty-state .big-icon{font-size:3rem;margin-bottom:20px}
.empty-state h3{color:#b1b9c9;margin-bottom:8px;font-size:1.2rem}
.empty-state p{font-size:.95rem}

.footer{margin-top:60px;padding-top:24px;border-top:1px solid #232b37;text-align:center;font-size:.85rem;color:#5b677a;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
.footer span{transition:color .2s}
.footer #footerStats:hover{color:var(--gold)}
.export-import{display:flex;gap:8px}
.export-import button{background:#1a1f2a;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:.8rem;cursor:pointer;transition:var(--transition)}
.export-import button:hover{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.back-top{position:fixed;bottom:30px;right:30px;background:#1a1f2a;border:1px solid var(--border);color:var(--muted);width:48px;height:48px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:var(--transition);z-index:100;box-shadow:var(--shadow)}
.back-top.visible{opacity:1;pointer-events:auto}
.back-top:hover{background:var(--gold);color:var(--bg);border-color:var(--gold);transform:translateY(-3px)}

.detail-overlay{position:fixed;inset:0;background:rgba(5,8,12,.88);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.detail-overlay.active{display:flex}
.detail-panel{background:#0f131b;border:1px solid var(--border2);border-radius:20px;max-width:960px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.8);animation:detailUp .3s ease;overflow:hidden}
@keyframes detailUp{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 26px;border-bottom:1px solid #232b37;background:linear-gradient(180deg,#151b26,#0f131b);flex-wrap:wrap}
.detail-title{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap;min-width:0}
.detail-title .item-emoji{font-size:2rem}
.detail-title h2{font-size:1.5rem;color:#fff;font-weight:700;word-break:break-word}
.detail-sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.detail-close{background:#1a1f2a;border:1px solid #2f3542;color:#b1b9c9;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);min-width:40px}
.detail-close:hover{background:var(--gold);color:var(--bg);border-color:var(--gold);transform:rotate(90deg)}
.detail-action-btns{display:flex;gap:8px;flex-shrink:0}
.detail-action-btns button{background:#1a1f2a;border:1px solid #2f3542;color:#b1b9c9;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.detail-action-btns button:hover{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.detail-body{padding:26px;display:flex;flex-direction:column;gap:22px}
.info-block{background:var(--bg2);border:1px solid #232b37;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.info-block h3{font-size:.95rem;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:8px}
.info-block h3 .ico{font-size:1.1rem}
.info-block p{color:var(--text2);font-size:.9rem;line-height:1.8}
.info-block ul{margin-left:18px;color:var(--text2);font-size:.9rem;line-height:1.9}
.info-block li::marker{color:var(--gold)}
.detail-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.meta-chip{background:var(--bg3);border:1px solid #1e2632;border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:center}
.meta-chip .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.meta-chip .v{font-size:1rem;color:#dfe5f0;font-weight:700}
mark.kw{background:var(--gold);color:var(--bg);border-radius:3px;padding:0 2px;font-weight:700}

.search-hint{display:none;background:rgba(240,176,0,.08);border:1px solid rgba(240,176,0,.3);border-radius:12px;padding:12px 18px;margin-bottom:16px;color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;transition:var(--transition);align-items:center;gap:8px}
.search-hint.visible{display:flex}
.search-hint:hover{background:rgba(240,176,0,.15);border-color:var(--gold)}

.tactic-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:var(--transition);position:relative;opacity:0;transform:translateY(20px)}
.tactic-card.visible{opacity:1;transform:translateY(0)}
.tactic-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-hover)}
.tactic-card .card-header{padding:16px 18px 10px;border-bottom:1px solid #232b37}
.tactic-card .item-name{font-size:1.15rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.tactic-card .card-body{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.tactic-card .tactic-points{background:var(--bg3);border-radius:12px;padding:12px 14px;border:1px solid #1e2632}
.tactic-card .tactic-points h4{font-size:.8rem;color:var(--gold);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.tactic-card .tactic-points ul{margin-left:16px;color:var(--text2);font-size:.85rem;line-height:1.9}
.tactic-card .tactic-points li::marker{color:var(--gold)}
.tactic-card .tactic-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tactic-card .tactic-meta .tag{background:#1e2632;padding:3px 10px;border-radius:12px;font-size:.72rem;color:#8a94a6;font-weight:600;border:1px solid #2f3a4a}
.tactic-card .tactic-meta .tag.map{color:#9bb5d4;border-color:#2a3a50;background:#1a2230}
.tactic-card .tactic-meta .tag.team{color:var(--t-color);border-color:var(--t-border);background:var(--t-bg)}

.team-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);grid-column:1/-1}
.team-card:hover{border-color:var(--gold);box-shadow:var(--shadow-hover)}
.team-card .team-header{padding:20px 24px;border-bottom:1px solid #232b37;background:linear-gradient(135deg,#151b26,#0f131b);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.team-card .team-logo{font-size:2.5rem}
.team-card .team-info{flex:1;min-width:200px}
.team-card .team-info h2{font-size:1.4rem;color:#fff;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.team-card .team-info .rank-badge{background:var(--gold);color:var(--bg);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:12px}
.team-card .team-info .region-tag{background:#1e2632;color:#8a94a6;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid #2f3a4a}
.team-card .team-style{padding:16px 24px;border-bottom:1px solid #232b37;color:var(--text2);font-size:.9rem;line-height:1.8}
.team-card .team-style strong{color:var(--gold);font-weight:700}
.team-card .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px 24px}
.player-card{background:var(--bg3);border:1px solid #1e2632;border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:8px;transition:var(--transition)}
.player-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.player-card .player-name{font-weight:700;color:#fff;font-size:1rem}
.player-card .player-id{color:var(--gold);font-size:.82rem;font-weight:700}
.player-card .player-role{font-size:.75rem;color:var(--muted);background:#1a1f2a;padding:2px 8px;border-radius:10px;align-self:flex-start;border:1px solid #2a3342}
.player-card .player-desc{font-size:.8rem;color:var(--text2);line-height:1.6}
.player-card .player-settings{font-size:.72rem;color:var(--muted);border-top:1px solid #1e2632;padding-top:8px;margin-top:4px}
.player-card .player-settings span{color:#9bb5d4}

.map-intro-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);grid-column:1/-1}
.map-intro-card:hover{border-color:var(--gold);box-shadow:var(--shadow-hover)}
.map-intro-card .map-banner{padding:24px 26px;border-bottom:1px solid #232b37;background:linear-gradient(135deg,#151b26,#0f131b);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.map-intro-card .map-banner .map-icon{font-size:3rem}
.map-intro-card .map-banner .map-title{flex:1;min-width:200px}
.map-intro-card .map-banner .map-title h2{font-size:1.5rem;color:#fff;font-weight:700}
.map-intro-card .map-banner .map-title .map-sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.map-intro-card .map-banner .map-tags{display:flex;gap:8px;flex-wrap:wrap}
.map-intro-card .map-banner .map-tags .tag{background:#1e2632;padding:4px 12px;border-radius:12px;font-size:.75rem;color:#9bb5d4;border:1px solid #2a3a50;font-weight:600}
.map-intro-card .map-body{padding:20px 26px;display:flex;flex-direction:column;gap:16px}
.map-intro-card .map-desc{color:var(--text2);font-size:.92rem;line-height:1.8}
.map-intro-card .map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.map-intro-card .map-section{background:var(--bg3);border:1px solid #1e2632;border-radius:var(--radius-sm);padding:14px 16px}
.map-intro-card .map-section h4{font-size:.82rem;color:var(--gold);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.map-intro-card .map-section ul{margin-left:16px;color:var(--text2);font-size:.85rem;line-height:1.9}
.map-intro-card .map-section li::marker{color:var(--gold)}

.weapon-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:var(--transition);position:relative;opacity:0;transform:translateY(20px);cursor:pointer}
.weapon-card.visible{opacity:1;transform:translateY(0)}
.weapon-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-hover)}
.weapon-card .card-header{padding:16px 18px 10px;border-bottom:1px solid #232b37}
.weapon-card .item-name{font-size:1.1rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.weapon-card .card-body{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.weapon-card .weapon-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--bg3);border-radius:12px;padding:12px;border:1px solid #1e2632}
.weapon-card .weapon-stat{display:flex;flex-direction:column;gap:2px;text-align:center}
.weapon-card .weapon-stat .k{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.weapon-card .weapon-stat .v{font-size:.9rem;color:#dfe5f0;font-weight:700}
.weapon-card .weapon-price{background:#1e2632;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700;color:var(--gold);border:1px solid #3a4357;white-space:nowrap}

@media(max-width:700px){

    .detail-overlay{padding:0}.detail-panel{border-radius:0;min-height:100vh}.detail-body{padding:18px}.detail-head{padding:18px}
    .detail-title h2{font-size:1.25rem}.back-top{bottom:20px;right:20px;width:42px;height:42px;font-size:1rem}
    .filter-btn{padding:7px 14px;font-size:.8rem}.sub-btn{padding:5px 10px;font-size:.72rem}
    .stats{gap:4px}.stat-value{font-size:.85rem}
    .search-mode{margin-left:0;margin-top:6px}

    .map-intro-card .map-banner{padding:18px}

/* 游戏按钮 */
.game-btn{background:transparent;border:2px solid var(--gold);color:var(--gold);padding:8px 18px;border-radius:30px;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:var(--transition);white-space:nowrap;letter-spacing:.5px;user-select:none}
.game-btn:hover{background:var(--gold);color:var(--bg);box-shadow:0 0 20px rgba(240,176,0,.4);transform:translateY(-1px)}
.game-btn:active{transform:translateY(0)}
@media(max-width:700px){.game-btn{padding:8px 12px;font-size:.82rem}.game-btn span{display:none}}

.game-overlay{position:fixed;inset:0;background:#0d0f13;z-index:2000;display:none;align-items:center;justify-content:center}

.game-frame-wrap{position:relative;width:100%;height:100%}
.game-frame{width:100%;height:100%;border:none;display:block;background:#0d0f13}

    // ============ 收藏 ============
    function loadFavorites() {
        try {
            var saved = localStorage.getItem('cs2_fav_points_v2');
            return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
    }
    function saveFavorites() {
        try { localStorage.setItem('cs2_fav_points_v2', JSON.stringify(favorites)); } catch (e) {}
    }
    function isFaved(id) { return favorites.indexOf(id) > -1; }
    function toggleFav(id) {
        var idx = favorites.indexOf(id);
        if (idx > -1) { favorites.splice(idx, 1); } else { favorites.push(id); }
        saveFavorites();
        updateFooterStats();
        return isFaved(id);
    }

    // ============ 工具函数 ============
    function matchKeywords(haystacks, query, mode) {
        mode = mode || searchMode || 'and';
        var q = String(query || '').replace(/\s+/g, '').toLowerCase();
        if (q === '') return true;
        var words = String(query || '').trim().split(/\s+/).filter(function(w) { return w !== ''; });
        if (words.length === 0) return true;
        var hay = '';
        for (var j = 0; j < haystacks.length; j++) {
            var h = haystacks[j];
            if (h) hay += String(h).replace(/\s+/g, '').toLowerCase();
        }
        if (mode === 'or') {
            return words.some(function(word) { return hay.indexOf(word) > -1; });
        } else {
            return words.every(function(word) { return hay.indexOf(word) > -1; });
        }
    }
    function highlight(text, query) {
        var t = String(text || '');
        var q = String(query || '').trim();
        if (q === '') return t;
        var words = q.split(/\s+/).map(function(w) { return w.replace(/\s+/g, ''); }).filter(function(w) { return w !== ''; });
        if (words.length === 0) return t;
        words.sort(function(a, b) { return b.length - a.length; });
        var escaped = words.map(function(w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
        var re = new RegExp('(' + escaped.join('|') + ')', 'gi');
        return t.replace(re, '<mark class="kw">$1</mark>');
    }
    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============ 模块切换 ============
    mainSwitch.addEventListener('click', function(e) {
        var btn = e.target.closest('.switch-btn');
        if (!btn) return;
        currentModule = btn.dataset.module;
        document.querySelectorAll('.switch-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.module === currentModule);
        });
        moduleItems.classList.toggle('active', currentModule === 'items');
        modulePoints.classList.toggle('active', currentModule === 'points');
        moduleTactics.classList.toggle('active', currentModule === 'tactics');
        moduleTeams.classList.toggle('active', currentModule === 'teams');
        moduleMaps.classList.toggle('active', currentModule === 'maps');
        moduleWeapons.classList.toggle('active', currentModule === 'weapons');
        hideSearchHint();
        if (currentModule === 'items') renderItems();
        else if (currentModule === 'points') renderPoints();
        else if (currentModule === 'tactics') renderTactics();
        else if (currentModule === 'teams') renderTeams();
        else if (currentModule === 'maps') renderMaps();
        else if (currentModule === 'weapons') renderWeapons();
        updateBackTopVisibility();
    });

    // ============ 道具渲染 ============
    function renderItems() {
        var list = itemsData.filter(function(it) {
            var cm = currentCategory === 'all' || it.category === currentCategory;
            var sm = matchKeywords([it.name, it.description, it.usage, it.side], currentSearch, searchMode);
            return cm && sm;
        });
        if (list.length === 0) {
            itemsGrid.innerHTML = '<div class="empty-state"><div class="big-icon">🔍</div><h3>没有找到匹配的道具</h3><p>尝试更换关键词或切换分类</p></div>';
        } else {
            var html = '';
            list.forEach(function(it) {
                var statsHTML = '';
                var lm = { damage: '伤害', radius: '半径', fuse: '引信', duration: '持续' };
                for (var k in it.stats) {
                    if (it.stats.hasOwnProperty(k)) {
                        statsHTML += '<div class="stat-item"><span class="stat-label">' + (lm[k] || k) + '</span><span class="stat-value">' + it.stats[k] + '</span></div>';
                    }
                }
                html += '<div class="item-card" data-item-id="' + it.id + '">' +
                    '<span class="card-hint">点击查看详情</span>' +
                    '<div class="card-header">' +
                    '<div class="item-name"><span class="item-emoji">' + it.emoji + '</span>' + highlight(it.name, currentSearch) + '</div>' +
                    '<div class="item-price">' + it.price + '</div>' +
                    '</div>' +
                    '<div class="card-body">' +
                    '<div class="description">' + highlight(it.description, currentSearch) + '</div>' +
                    '<div class="stats">' + statsHTML + '</div>' +
                    '<div class="meta-row"><span class="difficulty" style="color:#9bb5d4;">⚔️ ' + it.usage + '</span></div>' +
                    '</div></div>';
            });
            itemsGrid.innerHTML = html;
        }
        animateCards(itemsGrid);
        updateCategoryCounts();
    }

    // ============ 卡片动画 ============
    function animateCards(container) {
        var cards = container.querySelectorAll('.item-card, .tactic-card, .weapon-card');
        if ('IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            cards.forEach(function(card) { observer.observe(card); });
        } else {
            cards.forEach(function(card) { card.classList.add('visible'); });
        }
    }

        if (w.tips && w.tips.length) {
            tipsHTML = '<div class="info-block"><h3><span class="ico">💡</span>使用技巧</h3><ul>';
            w.tips.forEach(function(t) { tipsHTML += '<li>' + escapeHtml(t) + '</li>'; });
            tipsHTML += '</ul></div>';
        }
        var sideClass = w.side === 'T' ? 'T' : (w.side === 'CT' ? 'CT' : 'both');
        var catMap = { pistol: '手枪', smg: '冲锋枪', rifle: '步枪', sniper: '狙击枪', shotgun: '霰弹枪', mg: '机枪', gear: '装备' };
        panel.innerHTML =
            '<div class="detail-head">' +
            '<div class="detail-title">' +
            '<span class="item-emoji">' + w.emoji + '</span>' +
            '<div><h2>' + escapeHtml(w.name) + '</h2>' +
            '<div class="detail-sub">' +
            '<span class="side-badge ' + sideClass + '">' + escapeHtml(w.side) + '</span>' +
            '<span class="area-tag">' + (catMap[w.category] || w.category) + '</span>' +
            '<span class="item-price" style="font-size:1rem;">' + w.price + '</span>' +
            '</div></div></div>' +
            '<button class="detail-close" id="detailCloseBtn">✕</button>' +
            '</div>' +
            '<div class="detail-body">' +
            '<div class="detail-meta-grid">' + statsHTML + '</div>' +
            '<div class="info-block"><h3><span class="ico">📖</span>武器说明</h3><p>' + escapeHtml(w.description) + '</p></div>' +
            tipsHTML +
            '</div>';
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        history.replaceState(null, '', '#weapon-' + w.id);
        var cb = $('detailCloseBtn');
        if (cb) cb.addEventListener('click', closeDetail);
    }

    function closeDetail() {
        if (detailOverlay) detailOverlay.classList.remove('active');
        document.body.style.overflow = '';
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    // ============ 复制功能 ============
    function copyLink(id) {
        var url = window.location.href.split('#')[0] + '#point-' + id;
        navigator.clipboard.writeText(url).then(function() {
            alert('链接已复制到剪贴板');
        }).catch(function() {
            prompt('复制失败，请手动复制：', url);
        });
    }
    function copyPointInstruction(p) {
        var text = '【' + p.name + '】\n' +
            '阵营：' + (p.side === 'T' ? 'T 方' : 'CT 方') + '\n' +
            '道具：' + (typeName[p.type] || p.type) + '\n' +
            '难度：' + p.difficulty + '\n' +
            '投掷：' + p.throw + '\n' +
            '站位：' + (p.standPos || '无') + '\n' +
            '瞄准点：' + (p.aimPos || '无') + '\n' +
            '说明：' + p.description;
        navigator.clipboard.writeText(text).then(function() {
            alert('投掷指令已复制到剪贴板');
        }).catch(function() {
            prompt('复制失败，请手动复制：', text);
        });
    }

    // ============ 事件绑定 ============
    itemsGrid.addEventListener('click', function(e) {
        var card = e.target.closest('.item-card');
        if (!card) return;
        var id = card.getAttribute('data-item-id');
        if (id) openItemDetail(id);
    });
    pointsGrid.addEventListener('click', function(e) {
        var favBtn = e.target.closest('.fav-btn');
        if (favBtn) return;
        var card = e.target.closest('.point-card');
        if (!card) return;
        openPointDetail(card.getAttribute('data-point-id'));
    });
    // 武器卡片点击（新增）
    if (weaponsGrid) {
        weaponsGrid.addEventListener('click', function(e) {
            var card = e.target.closest('.weapon-card');
            if (!card) return;
            openWeaponDetail(card.getAttribute('data-weapon-id'));
        });
    }
    detailOverlay.addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
    });
       document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            // 优先关闭游戏（游戏打开时）
            if (gameOverlay && gameOverlay.classList.contains('active')) {
                closeGame();
            } else {
                closeDetail();
            }
        }
    });
    mapTabs.addEventListener('click', function(e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        currentMap = btn.dataset.map;
        currentArea = 'all';
        renderMapTabs();
        renderAreaTabs();
        renderPoints();
        hideSearchHint();
        updateBackTopVisibility();
    });
    areaTabs.addEventListener('click', function(e) {
        var btn = e.target.closest('.sub-btn');
        if (!btn) return;
        currentArea = btn.dataset.area;
        renderAreaTabs();
        renderPoints();
    });
    itemCategoryTabs.addEventListener('click', function(e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        currentCategory = btn.dataset.category;
        itemCategoryTabs.querySelectorAll('.filter-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.category === currentCategory);
        });
        renderItems();
        hideSearchHint();
    });
    searchModeEl.addEventListener('click', function(e) {
        var btn = e.target.closest('.mode-btn');
        if (!btn) return;
        searchMode = btn.dataset.mode;
        searchModeEl.querySelectorAll('.mode-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.mode === searchMode);
        });
        refreshAll();
    });

    var debounceTimer;
    searchInput.addEventListener('input', function(e) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            currentSearch = e.target.value;
            refreshAll();
        }, 300);
    });
    searchBtn.addEventListener('click', function() {
        currentSearch = searchInput.value;
        refreshAll();
    });
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            currentSearch = searchInput.value;
            refreshAll();
        }
    });
    searchClearBtn.addEventListener('click', function() {
        searchInput.value = '';
        currentSearch = '';
        refreshAll();
        searchInput.focus();
    });

    function updateClearBtnVisibility() {
        if (searchInput.value.length > 0) {
            searchClearBtn.classList.add('visible');
        } else {
            searchClearBtn.classList.remove('visible');
        }
    }

    function refreshAll() {
        updateClearBtnVisibility();
        updateSearchHint();
        if (currentModule === 'items') renderItems();
        else if (currentModule === 'points') { renderMapTabs(); renderAreaTabs(); renderPoints(); }
        else if (currentModule === 'tactics') renderTactics();
        else if (currentModule === 'teams') renderTeams();
        else if (currentModule === 'maps') renderMaps();
        else if (currentModule === 'weapons') renderWeapons();
    }

    function updateSearchHint() {
        if (currentSearch.trim() === '') {
            hideSearchHint();
            return;
        }
        var modules = ['items', 'points', 'tactics', 'teams', 'maps', 'weapons'];
        var nameMap = { items: '道具图鉴', points: '投掷点位', tactics: '战术百科', teams: '战队选手', maps: '地图介绍', weapons: '武器介绍' };
        var bestModule = null, bestCount = 0;
        modules.forEach(function(m) {
            if (m === currentModule) return;
            var c = getOtherModuleMatchCount(m, currentSearch);
            if (c > bestCount) { bestCount = c; bestModule = m; }
        });
        if (bestModule && bestCount > 0) {
            searchHintText.textContent = '在' + nameMap[bestModule] + '模块中找到 ' + bestCount + ' 个匹配结果，点击切换查看';
            searchHint.classList.add('visible');
            searchHint.setAttribute('data-target', bestModule);
        } else {
            hideSearchHint();
        }
    }

    function getOtherModuleMatchCount(module, query) {
        var count = 0;
        if (module === 'items') {
            itemsData.forEach(function(it) {
                if (matchKeywords([it.name, it.description, it.usage, it.side], query, searchMode)) count++;
            });
        } else if (module === 'points') {
            for (var k in mapsData) {
                if (!mapsData.hasOwnProperty(k)) continue;
                mapsData[k].points.forEach(function(p) {
                    if (matchKeywords([p.name, p.description, p.area, typeName[p.type], p.throw, p.standPos, p.aimPos], query, searchMode)) count++;
                });
            }
        } else if (module === 'tactics') {
            tacticsData.forEach(function(t) {
                if (matchKeywords([t.title, t.description, (t.points || []).join(' '), t.map, t.team, (t.tags || []).join(' ')], query, searchMode)) count++;
            });
        } else if (module === 'teams') {
            teamsData.forEach(function(t) {
                if (matchKeywords([t.name, t.style, (t.players || []).map(function(p) { return p.id + ' ' + p.name + ' ' + p.role + ' ' + p.desc; }).join(' ')], query, searchMode)) count++;
            });
        } else if (module === 'maps') {
            mapIntroData.forEach(function(m) {
                if (matchKeywords([m.name, m.en, m.description, (m.tags || []).join(' '), (m.sections || []).map(function(s) { return s.title + ' ' + (s.items || []).join(' '); }).join(' ')], query, searchMode)) count++;
            });
        } else if (module === 'weapons') {
            weaponsData.forEach(function(w) {
                if (matchKeywords([w.name, w.description, w.side, (w.tips || []).join(' ')], query, searchMode)) count++;
            });
        }
        return count;
    }

    function hideSearchHint() {
        searchHint.classList.remove('visible');
    }

    searchHint.addEventListener('click', function() {
        var target = searchHint.getAttribute('data-target');
        if (!target) return;
        currentModule = target;
        document.querySelectorAll('.switch-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.module === currentModule);
        });
        moduleItems.classList.toggle('active', currentModule === 'items');
        modulePoints.classList.toggle('active', currentModule === 'points');
        moduleTactics.classList.toggle('active', currentModule === 'tactics');
        moduleTeams.classList.toggle('active', currentModule === 'teams');
        moduleMaps.classList.toggle('active', currentModule === 'maps');
        moduleWeapons.classList.toggle('active', currentModule === 'weapons');
        hideSearchHint();
        if (currentModule === 'items') {
            currentCategory = 'all';
            itemCategoryTabs.querySelectorAll('.filter-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.category === 'all');
            });
            renderItems();
        } else if (currentModule === 'points') { renderMapTabs(); renderAreaTabs(); renderPoints(); }
        else if (currentModule === 'tactics') renderTactics();
        else if (currentModule === 'teams') renderTeams();
        else if (currentModule === 'maps') renderMaps();
        else if (currentModule === 'weapons') renderWeapons();
        updateBackTopVisibility();
    });

    // ============ 收藏导出/导入 ============
    exportFavBtn.addEventListener('click', function() {
        var data = JSON.stringify(favorites, null, 2);
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'cs2-favorites.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
    importFavBtn.addEventListener('click', function() {
        importFileInput.click();
    });
    importFileInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    favorites = imported.filter(function(id) { return typeof id === 'string'; });
                    saveFavorites();
                    renderAreaTabs();
                    renderPoints();
                    renderMapTabs();
                    updateFooterStats();
                    alert('收藏导入成功！');
                } else {
                    alert('文件格式不正确');
                }
            } catch (err) {
                alert('导入失败：文件不是有效的 JSON');
            }
        };
        reader.readAsText(file);
        importFileInput.value = '';
    });

    // ============ 回到顶部 ============
    function updateBackTopVisibility() {
        if (window.scrollY > 300) {
            backTop.classList.add('visible');
        } else {
            backTop.classList.remove('visible');
        }
    }
    window.addEventListener('scroll', updateBackTopVisibility, { passive: true });
    backTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ============ 页脚统计 ============
    function updateFooterStats() {
        var mapCount = 0, total = 0;
        for (var k in mapsData) {
            if (mapsData.hasOwnProperty(k)) {
                mapCount++;
                total += mapsData[k].points.length;
            }
        }
        if (footerStats) {
            footerStats.textContent = '⚡ ' + mapCount + ' 图 · ' + total + ' 点位 · ' + tacticsData.length + ' 战术 · ' + teamsData.length + ' 战队 · ' + mapIntroData.length + ' 地图 · ' + weaponsData.length + ' 武器';
        }
    }

    // ============ 分类计数 ============
    function updateCategoryCounts() {
        var counts = {};
        var filteredItems = itemsData.filter(function(it) {
            return matchKeywords([it.name, it.description, it.usage, it.side], currentSearch, searchMode);
        });
        counts.all = filteredItems.length;
        ['grenade', 'smoke', 'flash', 'molotov', 'decoy'].forEach(function(cat) {
            counts[cat] = filteredItems.filter(function(it) { return it.category === cat; }).length;
        });
        document.querySelectorAll('#itemCategoryTabs .filter-btn').forEach(function(btn) {
            var cat = btn.dataset.category;
            var countEl = btn.querySelector('.map-count');
            if (countEl) {
                countEl.textContent = counts[cat] !== undefined ? counts[cat] : 0;
            } else {
                btn.insertAdjacentHTML('beforeend', '<span class="map-count">' + (counts[cat] !== undefined ? counts[cat] : 0) + '</span>');
            }
        });
    }
    // ============ 小游戏开关 ============
    var gameBtn = $('gameBtn');
    var gameOverlay = $('gameOverlay');
    var gameFrame = $('gameFrame');
    var gameCloseBtn = $('gameCloseBtn');

    function openGame() {
    if (!gameOverlay || !gameFrame) return;
    // ★ 每次打开都重新加载，避免 about:blank 残留导致黑屏
    gameFrame.src = 'blackout.html';
    gameOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    // iframe 内聚焦，让键盘操作直接生效
    setTimeout(function() { try { gameFrame.focus(); } catch (e) {} }, 100);
}

function closeGame() {
    if (!gameOverlay) return;
    gameOverlay.classList.remove('active');
    document.body.style.overflow = '';
    // 清空 src，终止游戏循环，释放资源
    if (gameFrame) gameFrame.src = 'about:blank';
}

    if (gameBtn) gameBtn.addEventListener('click', openGame);
    if (gameCloseBtn) gameCloseBtn.addEventListener('click', closeGame);
    if (gameOverlay) {
        gameOverlay.addEventListener('click', function(e) {
            if (e.target === gameOverlay) closeGame();
        });
    }

    // ============ 初始化 ============
    function init() {
        document.querySelectorAll('#itemCategoryTabs .filter-btn').forEach(function(btn) {
            if (!btn.querySelector('.map-count')) {
                btn.insertAdjacentHTML('beforeend', '<span class="map-count">0</span>');
            }
        });
        renderItems();
        renderMapTabs();
        renderAreaTabs();
        renderPoints();
        renderTactics();
        renderTeams();
        renderMaps();
        renderWeapons();
        updateFooterStats();
        updateCategoryCounts();
        updateClearBtnVisibility();
        updateBackTopVisibility();
        var hash = location.hash;
        if (hash.startsWith('#point-')) {
            var id = hash.replace('#point-', '');
            if (findPoint(id)) {
                setTimeout(function() { openPointDetail(id); }, 100);
            }
        } else if (hash.startsWith('#item-')) {
            var itemId = hash.replace('#item-', '');
            if (findItem(itemId)) {
                setTimeout(function() { openItemDetail(itemId); }, 100);
            }
        } else if (hash.startsWith('#weapon-')) {
            var wid = hash.replace('#weapon-', '');
            if (findWeapon(wid)) {
                setTimeout(function() { openWeaponDetail(wid); }, 100);
            }
        }
        isInitialLoad = false;
    }

    init();

    window.addEventListener('hashchange', function() {
        if (isInitialLoad) return;
        var hash = location.hash;
        if (hash.startsWith('#point-')) {
            var id = hash.replace('#point-', '');
            if (findPoint(id) && !detailOverlay.classList.contains('active')) {
                openPointDetail(id);
            }
        } else if (hash.startsWith('#item-')) {
            var itemId = hash.replace('#item-', '');
            if (findItem(itemId) && !detailOverlay.classList.contains('active')) {
                openItemDetail(itemId);
            }
        } else if (hash.startsWith('#weapon-')) {
            var wid = hash.replace('#weapon-', '');
            if (findWeapon(wid) && !detailOverlay.classList.contains('active')) {
                openWeaponDetail(wid);
            }
        } else {
            if (detailOverlay.classList.contains('active')) closeDetail();
        }
    });

})();
</script>
</body>
</html>
